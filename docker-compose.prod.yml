services:
  app:
    image: ghcr.io/hakimfidjel/portfolio:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=portfolio-mysql
      - DB_PORT=3306
    volumes:
      - portfolio_storage:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.portfolio.rule=Host(`hakimfidjel.fr`) || Host(`www.hakimfidjel.fr`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.routers.portfolio.middlewares=secHeaders@file,rateLimit@file"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    networks:
      - traefik-network
      - portfolio-internal
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-portfolio}
      MYSQL_USER: ${DB_USERNAME:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portfolio-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  traefik-network:
    external: true
    name: traefik-network
  portfolio-internal:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  portfolio_storage:
