name: Docker Build and Push

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Test)
        run: docker build . --file Dockerfile --tag hakimfidjel/portfolio:${{ github.sha }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push Docker image (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag hakimfidjel/portfolio:${{ github.sha }} hakimfidjel/portfolio:latest
          docker push hakimfidjel/portfolio:latest
